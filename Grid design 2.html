<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Design</title>
    <style>
        .container{
            display:grid;
            height:500px;
            width:500px;
            grid-template-areas:
            "box1 box1 box1 box3"
            "box1 box1 box1 box3"
            "box4 box5 box6 box2"
            "box4 box5 box6 box2";
            gap:5px;
        }
        .container>div{
            box-shadow: 0px 0px 5px black;
        }

    </style>
</head>
<body>
    <div class="container">
    <div style="grid-area: box1;background-color: lightblue;">1</div>
    <div style="grid-area: box2;background-color: rgb(230, 205, 173);">2</div>
    <div style="grid-area: box3;background-color: rgb(230, 173, 173);">3</div>
    <div style="grid-area: box4;background-color: rgb(173, 230, 204);">4</div>
    <div style="grid-area: box5;background-color: rgb(230, 188, 173);">5</div>
    <div style="grid-area: box6;background-color: rgb(231, 236, 238);">6</div>
    </div>
    
</body>
</html>
