<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width:90vw;
            height: 90vh;
            outline:2px solid black;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
        }
        .container>div{
            background-color: red;
            color: white;
            height: 100px;
            align-content: center;
            text-align: center;
        }
        #box1{
            background-color: pink;
            flex-basis: 300px;
            flex-grow: 1;
            flex-shrink: 3;
        }
        #box2{
            background-color: brown;
            flex-basis: 300px;
            flex-grow: 1;
            flex-shrink: 1;
        }
        #box3{
            background-color: blue;
            flex-basis: 300px;
            flex-grow: 1;
            flex-shrink: 3;
        }
        #box4{
            background-color: red;
            flex-basis: 300px;
            flex-grow: 1;
            flex-shrink: 1;
        }
        #box5{
            background-color: yellow;
            flex-basis: 300px;
            flex-grow: 1;
            flex-shrink: 1;
        }
        #box6{
            background-color: green;
            flex-basis: 300px;
            flex-grow: 1;
            flex-shrink: 1;
        }
        #box7{
            background-color: orange;
            flex-basis: 300px;
            flex-grow: 3;
            flex-shrink: 0;
        }
        </style>
</head>
<body>
    <div class="container">
        
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
        <div id="box7">7</div>
    </div>
</body>
</html>
