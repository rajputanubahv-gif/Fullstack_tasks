<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <style>
        .items{
            height: 30px;
            width: 100%;
            background-color: #f3f3f3;
            border-radius: 5px;
            border: 1px solid black;
        }
        .progress{
            height: 30px;
            width: 0%;
            background-color: #4caf50;
            text-align: center;
            line-height: 30px;
            color: white;
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <h1 align="center">Health Progress Bar</h1>
    <div class="items">
        <div class="progress" id="healthBar"></div>
    </div>
</body>
</html>
