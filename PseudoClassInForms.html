<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* :enabled
        :disabled
        :valid
        :invalid
        :required
        :optional
        :in-range
        :read-only
        :read-write
        :out-of-range
        :placeholder-shown
        :checked */
        input{
            margin:3px;
            border-width: 0 0 2px 0;
            border-color:blue);
        }
        input:required{
            font-family: Arial, Helvetica, sans-serif;
        }
        input:optional{
            font-family:Montana;
        }
        input:valid{
            color: black;
        }
        input:invalid{
            color:red;
        }
        input:in-range{
            font-weight: 900;
        }
        input:out-of-range{
            font-size: 30px;
        }
        input:disabled{
            border-width: 0px;
            background-color: lightgrey !important;
        }
        input:enabled{
            background-color: aquamarine;
        }
        input:checked{
            box-shadow: 3px 3px 9 black;
        }
        input:read-only{
            background-color: transparent;
            border: 0;
        }
        input:placeholder-shown {
            font-family:Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <form>
        <input type="text" value="Mr." style="width: 20px;" readonly/>
        <input type="text" placeholder="First Name" required/><br>
        <input type="text" placeholder="Middle Name" optional/><br>
        <input type="text" placeholder="Last Name" required/><br>
        <input type="email" placeholder="Email" required/><br>
        <input type="number" placeholder="Age" min="18" max="150" required/><br>
        Country:<input type="text" placeholder="India" style="width:40px;" disabled/><br>
        <input type="checkbox" style="height: 30px; width: 30px;"/>Click Here Before Submitting<br>
        <button>Submit</button>

    </form>
</body>
</html>
