<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: #f4f6f9;
            color: #111827;
        }

        .sidebar {
            width: 240px;
            background: #111827;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 16px;
        }

        .sidebar a {
            color: #d1d5db;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: #ffffff;
        }

        .main {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 18px 22px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .navbar h3 {
            font-size: 1.25rem;
            color: #111827;
        }

        .navbar span {
            color: #4b5563;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        .card h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #111827;
        }

        .card p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        th,
        td {
            text-align: left;
            padding: 18px 20px;
        }

        th {
            background: #1f2937;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:nth-child(even) td {
            background: #f9fafb;
        }

        td {
            color: #374151;
            border-bottom: 1px solid #e5e7eb;
        }

        @media (max-width: 820px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }

            .sidebar h2 {
                width: 100%;
            }

            .sidebar a {
                width: calc(50% - 8px);
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2>Dashboard</h2>
        <a href="#">Home</a>
        <a href="#">Users</a>
        <a href="#">Products</a>
        <a href="#">Orders</a>
        <a href="#">Settings</a>
    </div>

    <div class="main">
        <div class="navbar">
            <h3>Admin Panel</h3>
            <span>Welcome, Ashish</span>
        </div>

        <div class="content">
            <div class="cards">
                <div class="card">
                    <h2>120</h2>
                    <p>Total Users</p>
                </div>
                <div class="card">
                    <h2>85</h2>
                    <p>Orders</p>
                </div>
                <div class="card">
                    <h2>5,200</h2>
                    <p>Revenue</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
