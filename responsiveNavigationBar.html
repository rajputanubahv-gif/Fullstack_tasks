<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>
</head>
<style>
    .container{
        display: flex;
        flex-direction: row;
        outline:1px solid black;
        font-size: 20px;
        text-align: center;
        justify-content: center;
        align-items: center;
    }
    #box1{
        flex:2 1 250px;
    }
    #box2,#box3,#box4,#box5,#box6{
        flex:1 1 100px;
    }
    #box1,#box2,#box3,#box4,#box5,#box6{
        justify-items: center;
        align-items: center;
    }
    .container>div{
        outline:1px dashed black;
        flex-basis: 100px;
        height: 50px;
    }
    h1{
        text-align: center;
    }
</style>
<body>
    <h1>Responsive Navigation Bar</h1>
    <div class="container">
        <div id="box1" text-align="center"><img src="D:\FULL STACKS\im.jpg" alt="TechNova" height="50px" width="100px">TechNova</div>
        <div id="box2"><a href="#">Home</a></div>
        <div id="box3"><a href="#">About</a></div>
        <div id="box4"><a href="#">Services</a></div>
        <div id="box5"><a href="#">Contact</a></div>
        <button id="box6">Login</button>
    
</body>
</html>
