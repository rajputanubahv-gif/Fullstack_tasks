<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Display(Linear, Radial, Conic)</title>
    <style>
        .box1, .box2, .box3, .box4, .box5{
            width: 300px;
            height: 300px;
        }
        .box1{
            background: linear-gradient(to bottom, #FF9933 0%, #FF9933 33.33%, #FFFFFF 33.33%, #FFFFFF 66.66%, #138808 66.66%, #138808 100%
);
        }
        .box2{
            background: radial-gradient(circle, blue 20%, green 50%, yellow 80%);
        }
        .box3{
            background: conic-gradient(purple 20%, pink 50%, green 80%);
        }
        .box4{
            background: radial-gradient(circle at 50% 50%,blue 50%,white 50%);
        }
        .box5{
            border-radius: 90%;background: radial-gradient(circle,white 40%,red 60%,purple 80%,blue 100%)
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
    </div>
</body>
</html>
