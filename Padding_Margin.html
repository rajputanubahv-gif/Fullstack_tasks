<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding and Margin</title>

    <style>
        .img1 {
            padding: 20px;
            background-color: lightblue;

        }

        .img2 {
            margin: 20px;
            background-color: lightgreen;
            
        }
    </style>
</head>

<body>

    <img src="im2.jpg" class="img1" width="200px" height="200px">
    <img src="im.jpg" class="img2" width="200px" height="200px">

</body>
</html>
